<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
</head>
<body>
  <div class="carousel">
    <button type="button" class=" carousel-button prev-button" (click)="prev()"> </button>


    <img class="overlay-image"
      [src]="imageUrls[currentIndex()]"
      [alt]="item.name"
    />

    <button type="button" class="carousel-button next-button" (click)="next()"> </button>

  </div>

</body>
</html>
