<div class="checkout-container">
  <form class="checkout-form">
    <h2 class="checkout-title">Check Out</h2>

    <div class="info-box">
      <div class="input-grid">
        <input type="text" class="input" placeholder="First Name" />
        <input type="text" class="input" placeholder="Last Name" />
        <input type="text" class="input"  placeholder="Phone Number" />
        <input type="text" class="input" placeholder="Email Address" />
        <input type="text" class="input full-width" placeholder="Address" />
        <div class="city-state-zip">
          <input type="text" class="input"  placeholder="City" />
          <select class="input2">
            <option value="state">State</option>
            <option>AL</option>
            <option>AK</option>
            <option>AZ</option>
            <option>AR</option>
            <option>CA</option>
            <option>CO</option>
            <option>CT</option>
            <option>DC</option>
            <option>DE</option>
            <option>FL</option>
            <option>GA</option>
            <option>HI</option>
            <option>ID</option>
            <option>IL</option>
            <option>IN</option>
            <option>IA</option>
            <option>KS</option>
            <option>KY</option>
            <option>LA</option>
            <option>ME</option>
            <option>MD</option>
            <option>MA</option>
            <option>MI</option>
            <option>MN</option>
            <option>MS</option>
            <option>MO</option>
            <option>MT</option>
            <option>NE</option>
            <option>NV</option>
            <option>NH</option>
            <option>NJ</option>
            <option>NM</option>
            <option>NY</option>
            <option>NC</option>
            <option>ND</option>
            <option>OH</option>
            <option>OK</option>
            <option>OR</option>
            <option>PA</option>
            <option>RI</option>
            <option>SC</option>
            <option>SD</option>
            <option>TN</option>
            <option>TX</option>
            <option>UT</option>
            <option>VT</option>
            <option>VA</option>
            <option>WA</option>
            <option>WV</option>
            <option>WI</option>
            <option>WY</option>
          </select>

          <input type="text" class="input" placeholder="Zip Code" />
        </div>
      </div>
      <div class="input-grid2">
        <input type="text" class="credit-card" placeholder="Credit Card #" />
        <input type="text" class="exp" placeholder="XX/XXXX" />
        <input type="text" class="cvv" placeholder="CVV" />
      </div>
    </div>

    <div class="shipping-options">
      <label class="shipping-option">
        <input type="radio" name="shipping" value="Overnight" checked>
        <div class="option-content">
          <h3>Overnight</h3>
          <p>$29.99</p>
        </div>
      </label>

      <label class="shipping-option">
        <input type="radio" name="shipping" value="3Day">
        <div class="option-content">
          <h3>3 Day</h3>
          <p>$19.99</p>
        </div>
      </label>

      <label class="shipping-option">
        <input type="radio" name="shipping" value="Ground">
        <div class="option-content">
          <h3>Ground</h3>
          <p>$0.00</p>
        </div>
      </label>
    </div>
    <div class="confirm-buttons">
      <button class="confirm-order-btn" routerLink="/confirm">Confirm Order ⮚</button>
      <button class="back-btn" routerLink="/inventory">⮘ Back</button>
    </div>


  </form>
</div>
