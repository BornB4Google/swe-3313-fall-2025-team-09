<h1 class="order-title">Completed Orders</h1>

<div class="order-content">
  <h2>Purchases</h2>
  <table class="receipt-info">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Total</th>
        <th>Date</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (r of receipts; track r.saleId) {
        <tr
          tabindex="0"
          role="button"
          (click)="openReceipt(r)"
          (keydown.enter)="openReceipt(r)"
          (keydown.space)="openReceipt(r)"
        >
          <td>{{ r.customerName }}</td>
          <td>{{ r.customerEmail }}</td>
          <td>{{ r.total | currency }}</td>
          <td>{{ r.saleDateTime | date: 'short' }}</td>
          <td>
            <button
              type="button"
              class="promote-btn"
              (click)="$event.stopPropagation(); openReceipt(r)"
            >
              View Receipt
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
  <app-receipt-modal [receipt]="selectedReceipt" (close)="closeReceipt()"></app-receipt-modal>
</div>
