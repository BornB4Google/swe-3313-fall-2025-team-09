<nav class="navbar">
  <a class="logo" routerLink="/landing">Offshore Holdings</a>
  @if (isLanding || isLanding2 || isLogin || isSignup) {
  } @else {
    <ul class="nav-links">
      @if (authService.currentUser()?.isAdmin) {
        <li><a routerLink="/admin">Admin</a></li>
      }
      <li><a routerLink="/inventory">Shop</a></li>
      <li class="search-dropdown">
        <a
          tabindex="0"
          role="button"
          (click)="toggleSearch()"
          (keydown.enter)="toggleSearch()"
          class="search-link"
          >Search</a
        >
        @if (showSearch) {
          <div class="search-dropdown-menu">
            <input
              type="text"
              placeholder="Search products..."
              [(ngModel)]="searchQuery"
              (keydown.enter)="onSearch()"
            />
            <button class="search-btn" (click)="onSearch()">Go</button>
          </div>
        }
      </li>
      <a routerLink="/shoppingCart" class="checkout-link">
        Checkout
        @if (cartCount > 0) {
          <span class="cart-badge">{{ cartCount }}</span>
        }
      </a>
      <li class="dropdown">
        <span class="account-label">Account</span>
        <ul class="dropdown-menu">
          <li><a routerLink="/account">Settings</a></li>
          <li>
            <a
              tabindex="0"
              role="button"
              (click)="logout()"
              (keydown.enter)="logout()"
              (keydown.space)="logout()"
              >Logout</a
            >
          </li>
        </ul>
      </li>
    </ul>
  }
</nav>

<router-outlet></router-outlet>
