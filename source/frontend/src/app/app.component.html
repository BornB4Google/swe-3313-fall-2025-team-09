<nav class="navbar">
  <a class="logo" routerLink="/landing">Offshore Holdings</a>
  @if (isLanding || isLanding2 || isLogin || isSignup) {
  } @else {
    <button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav-links" [class.open]="menuOpen">
      @if (authService.currentUser()?.isAdmin) {
        <li><a routerLink="/admin">Admin</a></li>
      }
      <li><a routerLink="/inventory">Shop</a></li>
      <li class="search-dropdown">
        <a
          tabindex="0"
          role="button"
          (click)="toggleSearch()"
          (keydown.enter)="toggleSearch()"
          class="search-link"
          >Search</a
        >
        @if (showSearch) {
          <div class="search-dropdown-menu">
            <div class="search-input-wrapper">
              <input
                type="text"
                placeholder="Search products..."
                [(ngModel)]="searchQuery"
                (ngModelChange)="onSearchInput($event)"
                (keydown.enter)="onSearch()"
              />
              @if (searchQuery) {
                <button
                  type="button"
                  class="search-clear-btn"
                  (click)="clearSearch()"
                  aria-label="Clear search"
                >
                  &#10007;
                </button>
              }
            </div>
          </div>
        }
      </li>
      <a routerLink="/shoppingCart" class="checkout-link">
        Checkout
        @if (cartCount > 0) {
          <span class="cart-badge">{{ cartCount }}</span>
        }
      </a>
      <li>
        <a
          tabindex="0"
          role="button"
          (click)="logout()"
          (keydown.enter)="logout()"
          class="logout-link"
          >Logout</a
        >
      </li>
    </ul>
  }
</nav>

<router-outlet></router-outlet>
